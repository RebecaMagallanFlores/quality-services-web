name: Publicar en GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Configurar Pages
        id: pages
        uses: actions/configure-pages@v5

      # El dominio (https://qualityservicesqs.com) y la ruta base (/) se toman de
      # src/site.config.json. No se usan base_url/base_path de GitHub Pages para que
      # el nombre del repositorio nunca se agregue como prefijo de las rutas.
      - name: Compilar
        run: node scripts/build.mjs

      - name: Verificar enlaces, recursos y ausencia del prefijo del repositorio
        run: node scripts/check.mjs

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@v4
